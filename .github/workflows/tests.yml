name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcode-select -p
          /usr/bin/python3 --version
      # System interpreter on purpose (no setup-python): daoc runs on the Command Line Tools' /usr/bin/python3.
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
