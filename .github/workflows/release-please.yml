name: release-please

on:
  push:
    branches: [main]

# GITHUB_TOKEN is unused: the release App's installation token opens the release PR
# and tags, so their events run tests.yml (events from GITHUB_TOKEN start no workflows).
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY live in the main environment.
    environment: main
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
